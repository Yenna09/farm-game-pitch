<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | YIB Studio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="main-theme">

    <header>
        <h1>YIB Studio</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="team.html">Equipo</a></li>
            </ul>
        </nav>
    </header>

    <main class="content-fade">
        <section>
            <h2>Contacto</h2>
            <p>¿Tienes alguna consulta o propuesta de colaboración? Envíanos un mensaje al vacío.</p>
            
            <div class="project-card" style="max-width: 500px; margin: 40px auto; text-align: left;">
                <form action="#" style="display: flex; flex-direction: column; gap: 20px;">
                    <label style="font-family: 'Cinzel'; font-size: 0.8em;">Nombre</label>
                    <input type="text" style="background: transparent; border: none; border-bottom: 1px solid #333; color: white; padding: 5px; outline: none;">
                    
                    <label style="font-family: 'Cinzel'; font-size: 0.8em;">Email</label>
                    <input type="email" style="background: transparent; border: none; border-bottom: 1px solid #333; color: white; padding: 5px; outline: none;">
                    
                    <label style="font-family: 'Cinzel'; font-size: 0.8em;">Mensaje</label>
                    <textarea rows="4" style="background: transparent; border: 1px solid #333; color: white; padding: 10px; outline: none;"></textarea>
                    
                    <button type="submit" class="btn-dossier" style="width: 100%;">Enviar Correspondencia</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="return-link centered">
        <a href="index.html">VALENTINA ZABALA LERENA — YIB STUDIO © 2026</a>
    </footer>

</body>
</html>
